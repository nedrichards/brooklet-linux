name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked

  flatpak:
    name: GNOME 51 Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//51 org.gnome.Sdk//51 org.freedesktop.Sdk.Extension.rust-stable//26.08
      - name: Configure, build, test, and validate
        run: flatpak-builder --user --disable-rofiles-fuse --force-clean build-dir flatpak/com.nedrichards.brooklet.Devel.json
      - name: GTK launch smoke test
        run: xvfb-run -a flatpak-builder --run build-dir flatpak/com.nedrichards.brooklet.Devel.json brooklet --smoke-test
