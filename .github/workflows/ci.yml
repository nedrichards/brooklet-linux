name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: 11 6 * * 3

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Test maintenance automation
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check Flatpak dependency sources
        run: python3 build-aux/generate-cargo-sources.py --check
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked

    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
  flatpak:
    name: GNOME 51 Flatpak
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Prepare isolated native session
        run: |
          set -o pipefail
          mkdir -p .ci-results "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          if [[ ! -e /usr/bin/dbus-daemon ]]; then
            ln -s "$(command -v dbus-daemon)" /usr/bin/dbus-daemon
          fi
          mkdir -p /app/var/lib/dbus /var/lib/dbus
          dbus-uuidgen --ensure=/app/var/lib/dbus/machine-id
          cp /app/var/lib/dbus/machine-id /var/lib/dbus/machine-id
          cp /app/var/lib/dbus/machine-id /etc/machine-id
          mkdir -p /app/share/dbus-1/services
          cat > /app/share/dbus-1/services/org.freedesktop.portal.Flatpak.service <<'SERVICE'
          [D-BUS Service]
          Name=org.freedesktop.portal.Flatpak
          Exec=/app/libexec/flatpak-portal --no-idle-exit
          SERVICE
          bash scripts/ci/display-tools.sh 2>&1 | tee .ci-results/display-tools.log
      - name: Install pinned SDK Rust extension
        run: flatpak install --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//26.08
      - name: Build and test Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          arch: ${{ matrix.arch }}
          bundle: Brooklet-Devel-${{ github.sha }}-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/com.nedrichards.brooklet.Devel.json
          build-dir: build-dir
          repo-dir: repo
          run-tests: true
          keep-build-dirs: true
          upload-artifact: false
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Install and validate exported bundle
        id: installed
        env:
          BUNDLE: Brooklet-Devel-${{ github.sha }}-${{ matrix.arch }}.flatpak
        run: |
          set -o pipefail
          flatpak install --user --reinstall --noninteractive "$PWD/$BUNDLE"
          test "$(uname -m)" = "$BUILD_ARCH"
          ref=$(flatpak info --user --show-ref "$APP_ID")
          [[ "$ref" == "app/$APP_ID/$BUILD_ARCH/"* ]]
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1200x24' bash scripts/ci/session.sh bash scripts/ci/installed-validation.sh 2>&1 | tee .ci-results/installed.log
      - name: Record validated source and bundle checksums
        env:
          BUNDLE: Brooklet-Devel-${{ github.sha }}-${{ matrix.arch }}.flatpak
        run: |
          {
            printf 'Built checkout: %s\nArchitecture: %s\n' "$GITHUB_SHA" "$BUILD_ARCH"
            flatpak info --user --show-commit "$APP_ID"
            flatpak info --show-commit org.gnome.Platform//51
            flatpak info --show-commit org.gnome.Sdk//51
          } > ".ci-results/BUILD_INFO-$BUILD_ARCH.txt"
          sha256sum -- "$BUNDLE" > ".ci-results/SHA256SUMS-$BUILD_ARCH"
      - name: Required pull-to-refresh regression
        run: dbus-run-session -- xvfb-run -a flatpak build --share=network --share=ipc --socket=x11
          --env=GDK_BACKEND=x11 build-dir brooklet --pull-refresh-test
      - name: Required physical keyboard regression
        run: dbus-run-session -- xvfb-run -a flatpak build --share=network --share=ipc --socket=x11
          --env=GDK_BACKEND=x11 --bind-mount=/run/brooklet-keyboard-event.py="$PWD/build-aux/keyboard-event.py"
          --env=BROOKLET_KEYBOARD_DRIVER=/run/brooklet-keyboard-event.py build-dir brooklet --keyboard-test
      - name: Required physical double-click regression
        run: dbus-run-session -- xvfb-run -a flatpak build --share=ipc --socket=x11 --env=GDK_BACKEND=x11
          --bind-mount=/run/brooklet-keyboard-event.py="$PWD/build-aux/keyboard-event.py"
          --env=BROOKLET_KEYBOARD_DRIVER=/run/brooklet-keyboard-event.py build-dir brooklet --click-test
      - name: Desktop smoke observations (advisory)
        id: desktop_smoke
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        env:
          BUILD_DIR: build-dir
        run: |
          set -o pipefail
          dbus-run-session -- xvfb-run -a flatpak build --share=network --share=ipc --socket=x11 --env=GDK_BACKEND=x11 "$BUILD_DIR" brooklet --smoke-test 2>&1 | tee desktop-smoke.log
      - name: Preserve desktop smoke report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: desktop-smoke-${{ github.sha }}-${{ matrix.arch }}
          path: desktop-smoke.log
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize desktop smoke observations
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.desktop_smoke.outcome }}
        shell: bash
        run: |
          {
            echo '### Desktop smoke (advisory)'
            echo "Outcome: ${SMOKE_OUTCOME}"
            echo 'Full desktop/decoder checks remain in the installed-app local suite.'
            echo 'The desktop-smoke artifact retains the hosted report for 14 days.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload development bundle
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: Brooklet-Devel-${{ github.sha }}-${{ matrix.arch }}
          path: Brooklet-Devel-${{ github.sha }}-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 14
      - name: Summarize development bundle
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo '### Development Flatpak'
            echo "Download: ${ARTIFACT_URL}"
            echo "Built checkout: ${GITHUB_SHA}"
            echo "PR head: ${PR_HEAD}"
            echo 'Retention: 14 days'
            echo 'Install after extracting the artifact:'
            echo '```console'
            echo "flatpak install --user ./Brooklet-Devel-${GITHUB_SHA}-${{ matrix.arch }}.flatpak"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Flatpak test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: flatpak-test-logs-${{ github.sha }}-${{ matrix.arch }}
          path: .flatpak-builder/build/**/meson-logs/testlog.*
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
      - name: Build visual review index
        if: always()
        run: python3 scripts/ci/visual-report.py
      - name: Preserve installed diagnostics and fixture review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-review-${{ matrix.arch }}-${{ github.sha }}
          path: .ci-results/
          if-no-files-found: warn
          retention-days: 14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      image:
        ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged --volume /var/lib/flatpak
    defaults:
      run:
        shell: bash
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      APP_ID: com.nedrichards.brooklet.Devel
      XDG_RUNTIME_DIR: /run/user/0
